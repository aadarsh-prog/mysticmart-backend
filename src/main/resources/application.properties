server.port=8080

# ?? Database ??????????????????????????????????????????????????????????????????
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=MysticMartPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# ?? JPA ???????????????????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ?? JWT ???????????????????????????????????????????????????????????????????????
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_ACCESS_EXPIRY_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# ?? Cache ?????????????????????????????????????????????????????????????????????
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# ?? Mail ??????????????????????????????????????????????????????????????????????
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ?? Razorpay ??????????????????????????????????????????????????????????????????
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ?? CORS ??????????????????????????????????????????????????????????????????????
# Set to your EC2 public IP or domain, e.g.: http://13.x.x.x or https://yourdomain.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ?? Thread pool ???????????????????????????????????????????????????????????????
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=500
spring.task.execution.pool.keep-alive=60s

# ?? Logging ???????????????????????????????????????????????????????????????????
logging.level.root=WARN
logging.level.com.mysticmart=INFO

# ?? Actuator ??????????????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ?? Swagger (disable in production) ??????????????????????????????????????????
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false